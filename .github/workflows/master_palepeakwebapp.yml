# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP app to Azure Web App - palepeakwebapp

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_85ECD2B220414634B3985DD0B2B0DE0C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2E98135E56FD4D4AB1677046E8B44A2B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8EA014249E8441FDA3A3883FAE7CF1B1 }}

      - name: Run Azure CLI Action
        uses: azure/cli@v2
        with:
          azcliversion: latest # Or specify a precise version like 2.50.0
          inlineScript: |
            az webapp deploy --subscription d7c55ae9-d903-4ef2-b455-88474b75fa73 --name palepeakwebapp --resource-group bobby --src-path build.zip
          